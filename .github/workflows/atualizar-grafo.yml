name: Atualizar Grafo de Conhecimento

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# ADICIONADO: Necessário para o bot ter permissão de fazer o git push
permissions:
  contents: write 

# Impede 2 execuções deste workflow rodando ao mesmo tempo (ex: cron
# disparando enquanto um rerun/dispatch manual ainda está em andamento).
# Nova execução espera a anterior terminar, em vez de rodar em paralelo
# e causar corrida de checkout/push como a que gerou o erro relatado.
concurrency:
  group: atualizar-grafo-conhecimento
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install graphology graphology-layout graphology-layout-forceatlas2 cheerio
        working-directory: build

      - name: Rodar build
        run: node main.js
        working-directory: build

      - name: Commit do JSON atualizado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # ATENÇÃO: Garanta que este caminho está correto e bate com a URL do front-end
          git add dados-grafo-conhecimento.json
          
          git diff --staged --quiet || git commit -m "Atualiza grafo de conhecimento (automático)"

          # Se o remoto avançou entre o checkout e este ponto (ex: rerun
          # de job, ou outro push manual no meio), traz o que mudou lá
          # e reaplica este commit por cima, em vez de falhar o push.
          git pull --rebase origin main
          git push

      - name: Purgar cache do jsDelivr automaticamente
        run: curl -s https://purge.jsdelivr.net/gh/f1descatholica/grafo-blog@main/dados-grafo-conhecimento.json
