name: Atualizar Grafo de Conhecimento

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# ADICIONADO: Necessário para o bot ter permissão de fazer o git push
permissions:
  contents: write 

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install graphology graphology-layout graphology-layout-forceatlas2 cheerio
        working-directory: build

      - name: Rodar build
        run: node main.js
        working-directory: build

      - name: Commit do JSON atualizado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add dados-grafo-conhecimento.json
          
          git diff --staged --quiet || git commit -m "Atualiza grafo de conhecimento (automático)"
          git push
